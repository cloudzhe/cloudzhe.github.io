<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudZhe - 个人主页</title>
  <link rel="icon" href="/img/my.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      color: #fff;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === Background === */
    #bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 40%, #2d5a87 70%, #3a7ca5 100%);
      background-size: cover;
      background-position: center;
      transition: opacity 1.2s ease-in-out;
    }
    #bg::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.15);
    }

    /* === Loading === */
    #loading {
      position: fixed;
      inset: 0;
      background: #0d1117;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }
    #loading.fade { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #425AEF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* === Glass card base === */
    .glass {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }

    /* === Main wrapper - centered === */
    .wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 2rem 1rem;
    }

    /* === Two-column layout === */
    .content {
      display: flex;
      gap: 4rem;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }

    /* === Left zone === */
    .left-zone {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      flex-shrink: 0;
    }

    /* Profile row: avatar + name */
    .profile {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .profile-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.25);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .profile-name {
      font-family: 'Pacifico', cursive;
      font-size: 2.4rem;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
      letter-spacing: 0.01em;
    }

    /* Quote card */
    .quote-card {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 1.25rem 1.75rem;
      max-width: 320px;
      position: relative;
    }
    .quote-card .q-mark-top {
      position: absolute;
      top: -4px;
      left: 10px;
      font-size: 2.2rem;
      color: rgba(255,255,255,0.2);
      font-family: Georgia, serif;
      line-height: 1;
    }
    .quote-card .q-mark-bottom {
      position: absolute;
      bottom: -18px;
      right: 10px;
      font-size: 2.2rem;
      color: rgba(255,255,255,0.2);
      font-family: Georgia, serif;
      line-height: 1;
    }
    .quote-card .q-en {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 0.3rem;
    }
    .quote-card .q-cn {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
    }

    /* Social icons */
    .social-bar {
      display: flex;
      gap: 1rem;
    }
    .social-bar a {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .social-bar a:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-3px);
    }
    .social-bar a .xhs-icon {
      width: 18px;
      height: 18px;
      background: url('/img/xiaohongshu.svg') no-repeat center/contain;
      filter: brightness(0) invert(1);
      display: inline-block;
    }

    /* === Right zone === */
    .right-zone {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Clock + Hitokoto row */
    .top-widgets {
      display: flex;
      gap: 1rem;
    }

    /* Time/Weather card */
    .time-card {
      padding: 1rem 1.25rem;
      text-align: center;
      min-width: 220px;
    }
    .tc-date {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.75);
      margin-bottom: 0.3rem;
    }
    .tc-clock {
      font-size: 2.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.2;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    .tc-weather {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.7);
      margin-top: 0.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    /* Hitokoto card */
    .hito-card {
      padding: 1rem 1.25rem;
      max-width: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .hito-text {
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .hito-from {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.6);
      text-align: right;
      margin-top: 0.4rem;
    }

    /* === Website grid === */
    .links-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .links-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.65);
    }
    .links-header i { font-size: 0.75rem; }
    .links-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    .link-card {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
      min-width: 120px;
    }
    .link-card:hover {
      background: rgba(255,255,255,0.22);
      transform: translateY(-2px);
    }
    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .link-icon i {
      font-size: 1.1rem;
      color: #fff;
    }
    .link-card:hover .link-icon {
      transform: scale(1.1);
    }
    .link-card span {
      font-size: 0.82rem;
      white-space: nowrap;
    }

    /* === Footer === */
    .footer {
      text-align: center;
      padding: 0.75rem;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      width: 100%;
    }
    .footer a {
      color: rgba(255,255,255,0.4);
      text-decoration: none;
    }

    /* === Mobile === */
    @media (max-width: 768px) {
      .content {
        flex-direction: column;
        gap: 2rem;
        max-width: 400px;
      }
      .left-zone {
        align-items: center;
        text-align: center;
      }
      .top-widgets {
        flex-direction: column;
      }
      .links-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .profile-name { font-size: 1.8rem; }
      .social-bar { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading"><div class="spinner"></div></div>

  <!-- Background -->
  <div id="bg"></div>

  <!-- Main Wrapper -->
  <div class="wrapper">
    <div class="content">

      <!-- ===== Left Zone ===== -->
      <div class="left-zone">
        <!-- Profile: avatar + name -->
        <div class="profile">
          <img src="https://cravatar.cn/avatar/00000000000000000000000000000000?s=88&d=mp"
               alt="CloudZhe" class="profile-avatar"
               onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2288%22 height=%2288%22 viewBox=%220 0 88 88%22%3E%3Crect width=%2288%22 height=%2288%22 fill=%22%23425AEF%22 rx=%2244%22/%3E%3Ctext x=%2244%22 y=%2252%22 font-size=%2236%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22%3EC%3C/text%3E%3C/svg%3E';">
          <span class="profile-name">CloudZhe</span>
        </div>

        <!-- Quote Card -->
        <div class="quote-card">
          <span class="q-mark-top">&ldquo;</span>
          <div class="q-en">Always believe that something wonderful is about to happen.</div>
          <div class="q-cn">永远相信美好的事情即将发生。</div>
          <span class="q-mark-bottom">&rdquo;</span>
        </div>

        <!-- Social Icons (synced from blog footer) -->
        <div class="social-bar">
          <a href="https://github.com/cloudzhe" target="_blank" title="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://space.bilibili.com/2062780287" target="_blank" title="Bilibili">
            <i class="fab fa-bilibili"></i>
          </a>
          <a href="https://xhslink.com/m/8sF485sZjOC" target="_blank" title="小红书">
            <i class="xhs-icon"></i>
          </a>
          <a href="mailto:649015069@qq.com" title="邮箱">
            <i class="fas fa-envelope"></i>
          </a>
          <a href="https://blog.wangyuzhe.top" target="_blank" title="博客">
            <i class="fas fa-blog"></i>
          </a>
        </div>
      </div>

      <!-- ===== Right Zone ===== -->
      <div class="right-zone">
        <!-- Clock + Hitokoto side by side -->
        <div class="top-widgets">
          <div class="glass time-card">
            <div class="tc-date" id="date">加载中...</div>
            <div class="tc-clock" id="clock">00:00:00</div>
            <div class="tc-weather" id="weather">
              <i class="fas fa-spinner fa-spin"></i>
              <span>获取中</span>
            </div>
          </div>

          <div class="glass hito-card">
            <div class="hito-text" id="hitoText">获取一言中...</div>
            <div class="hito-from" id="hitoFrom"></div>
          </div>
        </div>

        <!-- Recommended Websites Grid -->
        <div class="links-section">
          <div class="links-header">
            <i class="fas fa-th-large"></i>
            <span>推荐网站</span>
          </div>
          <div class="links-grid">
            <a class="glass link-card" href="https://music.163.com" target="_blank">
              <div class="link-icon" style="background:#C20C0C"><i class="fas fa-music"></i></div>
              <span>网易云</span>
            </a>
            <a class="glass link-card" href="https://www.bilibili.com" target="_blank">
              <div class="link-icon" style="background:#FB7299"><i class="fab fa-bilibili"></i></div>
              <span>哔哩哔哩</span>
            </a>
            <a class="glass link-card" href="https://limestart.cn" target="_blank">
              <div class="link-icon" style="background:#8BC34A"><i class="fas fa-lemon"></i></div>
              <span>青柠起始页</span>
            </a>
            <a class="glass link-card" href="https://tophub.today" target="_blank">
              <div class="link-icon" style="background:#F05032"><i class="fas fa-fire"></i></div>
              <span>今日热榜</span>
            </a>
            <a class="glass link-card" href="https://blog.wangyuzhe.top" target="_blank">
              <div class="link-icon" style="background:#425AEF"><i class="fas fa-blog"></i></div>
              <span>我的博客</span>
            </a>
            <a class="glass link-card" href="https://z.weixin.qq.com" target="_blank">
              <div class="link-icon" style="background:#07C160"><i class="fas fa-keyboard"></i></div>
              <span>微信输入法</span>
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== Footer ===== -->
  <div class="footer">
    <p>&copy; 2026 CloudZhe &middot; <a href="https://blog.wangyuzhe.top">wangyuzhe.top</a></p>
  </div>

  <script>
    // === Background ===
    /**
     * Set background from Lorem Picsum random landscape
     */
    function setBg() {
      var el = document.getElementById('bg');
      // Lorem Picsum: free random high-quality images, CORS-friendly
      var url = 'https://picsum.photos/1920/1080?random=' + Date.now();
      var img = new Image();
      img.onload = function() {
        el.style.backgroundImage = 'url(' + url + ')';
      };
      img.onerror = function() {
        // Keep the default CSS gradient background if image fails
        el.style.backgroundImage = '';
      };
      img.src = url;
    }
    setBg();
    setInterval(setBg, 600000);

    // === Clock ===
    /**
     * Update clock and date every second
     */
    function tick() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      var s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m + ':' + s;

      var wd = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('date').textContent =
        now.getFullYear() + '年' +
        String(now.getMonth() + 1).padStart(2, '0') + '月' +
        String(now.getDate()).padStart(2, '0') + '日 ' +
        wd[now.getDay()];
    }
    tick();
    setInterval(tick, 1000);

    // === Weather ===
    /**
     * Map Open-Meteo weather code to Chinese description and FontAwesome icon
     * @param {number} code - WMO Weather interpretation code
     * @returns {object} Chinese text and icon class
     */
    function mapWeatherCode(code) {
      var map = {
        0: { text: '晴', icon: 'fas fa-sun' },
        1: { text: '晴间多云', icon: 'fas fa-cloud-sun' },
        2: { text: '多云', icon: 'fas fa-cloud' },
        3: { text: '阴', icon: 'fas fa-cloud' },
        45: { text: '雾', icon: 'fas fa-smog' },
        48: { text: '雾凇', icon: 'fas fa-smog' },
        51: { text: '毛毛雨', icon: 'fas fa-cloud-rain' },
        53: { text: '中毛毛雨', icon: 'fas fa-cloud-rain' },
        55: { text: '大毛毛雨', icon: 'fas fa-cloud-rain' },
        61: { text: '小雨', icon: 'fas fa-cloud-rain' },
        63: { text: '中雨', icon: 'fas fa-cloud-showers-heavy' },
        65: { text: '大雨', icon: 'fas fa-cloud-showers-heavy' },
        71: { text: '小雪', icon: 'fas fa-snowflake' },
        73: { text: '中雪', icon: 'fas fa-snowflake' },
        75: { text: '大雪', icon: 'fas fa-snowflake' },
        80: { text: '阵雨', icon: 'fas fa-cloud-rain' },
        81: { text: '强阵雨', icon: 'fas fa-cloud-showers-heavy' },
        82: { text: '暴雨', icon: 'fas fa-cloud-showers-heavy' },
        95: { text: '雷暴', icon: 'fas fa-bolt' },
        96: { text: '雷暴伴冰雹', icon: 'fas fa-bolt' },
        99: { text: '雷暴伴大冰雹', icon: 'fas fa-bolt' }
      };
      return map[code] || { text: '多云', icon: 'fas fa-cloud' };
    }

    /**
     * Fetch weather from Open-Meteo (free, no key, CORS enabled)
     * @param {number} lat - latitude
     * @param {number} lon - longitude
     * @param {HTMLElement} el - weather container element
     */
    function fetchWeather(lat, lon, el) {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
                '&longitude=' + lon +
                '&current=temperature_2m,weather_code&timezone=auto';
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d && d.current) {
            var info = mapWeatherCode(d.current.weather_code);
            var temp = d.current.temperature_2m;
            el.innerHTML = '<i class="' + info.icon + '"></i><span>' +
              info.text + ' ' + temp + '°C</span>';
          } else {
            showWeatherFallback(el);
          }
        })
        .catch(function() {
          showWeatherFallback(el);
        });
    }

    /**
     * Weather fallback display
     */
    function showWeatherFallback(el) {
      el.innerHTML = '<i class="fas fa-cloud-sun"></i><span>天气暂不可用</span>';
    }

    /**
     * Get weather: try browser geolocation, fallback to Beijing
     */
    function getWeather() {
      var el = document.getElementById('weather');
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(pos) {
            fetchWeather(pos.coords.latitude, pos.coords.longitude, el);
          },
          function() {
            // Fallback: Beijing coordinates
            fetchWeather(39.9042, 116.4074, el);
          },
          { timeout: 8000 }
        );
      } else {
        fetchWeather(39.9042, 116.4074, el);
      }
    }
    getWeather();

    // === Hitokoto ===
    /**
     * Fetch quote from Hitokoto API
     */
    function getHito() {
      var txt = document.getElementById('hitoText');
      var from = document.getElementById('hitoFrom');
      fetch('https://v1.hitokoto.cn/?c=d&c=i&c=k&encode=json')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          txt.textContent = d.hitokoto;
          from.textContent = '— 「' + (d.from || '佚名') + '」';
        })
        .catch(function() {
          txt.textContent = '即使你忘却了我，我也不会遗忘你。';
          from.textContent = '— 「菜月昂」';
        });
    }
    getHito();
    setInterval(getHito, 30000);

    // === Hide loading ===
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading').classList.add('fade');
      }, 400);
    });
  </script>
</body>
</html>
