<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudZhe - 个人主页</title>
  <link rel="icon" href="/img/my.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      color: #fff;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === Background === */
    #bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 40%, #2d5a87 70%, #3a7ca5 100%);
      background-size: cover;
      background-position: center;
      transition: opacity 1.2s ease-in-out;
    }
    #bg::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.15);
    }

    /* === Loading === */
    #loading {
      position: fixed;
      inset: 0;
      background: #0d1117;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }
    #loading.fade { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #425AEF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* === Glass card base === */
    .glass {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }

    /* === Main wrapper - centered === */
    .wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 2rem 1rem;
    }

    /* === Two-column layout === */
    .content {
      display: flex;
      gap: 4rem;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }

    /* === Left zone === */
    .left-zone {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      flex-shrink: 0;
    }

    /* Profile row: avatar + name */
    .profile {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .profile-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.25);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .profile-name {
      font-family: 'Pacifico', cursive;
      font-size: 2.4rem;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
      letter-spacing: 0.01em;
    }

    /* Quote card */
    .quote-card {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 1.25rem 1.75rem;
      max-width: 320px;
      position: relative;
    }
    .quote-card .q-mark-top {
      position: absolute;
      top: -4px;
      left: 10px;
      font-size: 2.2rem;
      color: rgba(255,255,255,0.2);
      font-family: Georgia, serif;
      line-height: 1;
    }
    .quote-card .q-mark-bottom {
      position: absolute;
      bottom: -18px;
      right: 10px;
      font-size: 2.2rem;
      color: rgba(255,255,255,0.2);
      font-family: Georgia, serif;
      line-height: 1;
    }
    .quote-card .q-en {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 0.3rem;
    }
    .quote-card .q-cn {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
    }

    /* Social icons */
    .social-bar {
      display: flex;
      gap: 1rem;
    }
    .social-bar a {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .social-bar a:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-3px);
    }

    /* === Right zone === */
    .right-zone {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Clock + Hitokoto row */
    .top-widgets {
      display: flex;
      gap: 1rem;
    }

    /* Time/Weather card */
    .time-card {
      padding: 1rem 1.25rem;
      text-align: center;
      min-width: 220px;
    }
    .tc-date {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.75);
      margin-bottom: 0.3rem;
    }
    .tc-clock {
      font-size: 2.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.2;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    .tc-weather {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.7);
      margin-top: 0.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    /* Hitokoto card */
    .hito-card {
      padding: 1rem 1.25rem;
      max-width: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .hito-text {
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .hito-from {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.6);
      text-align: right;
      margin-top: 0.4rem;
    }

    /* === Website grid === */
    .links-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .links-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.65);
    }
    .links-header i { font-size: 0.75rem; }
    .links-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    .link-card {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
      min-width: 120px;
    }
    .link-card:hover {
      background: rgba(255,255,255,0.22);
      transform: translateY(-2px);
    }
    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .link-icon i {
      font-size: 1.1rem;
      color: #fff;
    }
    .link-card:hover .link-icon {
      transform: scale(1.1);
    }
    .link-card span {
      font-size: 0.82rem;
      white-space: nowrap;
    }

    /* === Footer === */
    .footer {
      text-align: center;
      padding: 0.75rem;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      width: 100%;
    }
    .footer a {
      color: rgba(255,255,255,0.4);
      text-decoration: none;
    }

    /* === Mobile === */
    @media (max-width: 768px) {
      .content {
        flex-direction: column;
        gap: 2rem;
        max-width: 400px;
      }
      .left-zone {
        align-items: center;
        text-align: center;
      }
      .top-widgets {
        flex-direction: column;
      }
      .links-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .profile-name { font-size: 1.8rem; }
      .social-bar { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading"><div class="spinner"></div></div>

  <!-- Background -->
  <div id="bg"></div>

  <!-- Main Wrapper -->
  <div class="wrapper">
    <div class="content">

      <!-- ===== Left Zone ===== -->
      <div class="left-zone">
        <!-- Profile: avatar + name -->
        <div class="profile">
          <img src="https://cravatar.cn/avatar/00000000000000000000000000000000?s=88&d=mp"
               alt="CloudZhe" class="profile-avatar"
               onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2288%22 height=%2288%22 viewBox=%220 0 88 88%22%3E%3Crect width=%2288%22 height=%2288%22 fill=%22%23425AEF%22 rx=%2244%22/%3E%3Ctext x=%2244%22 y=%2252%22 font-size=%2236%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22%3EC%3C/text%3E%3C/svg%3E';">
          <span class="profile-name">CloudZhe</span>
        </div>

        <!-- Quote Card -->
        <div class="quote-card">
          <span class="q-mark-top">&ldquo;</span>
          <div class="q-en">You're someone's whole world.</div>
          <div class="q-cn">一人即某人的全世界。</div>
          <span class="q-mark-bottom">&rdquo;</span>
        </div>

        <!-- Social Icons -->
        <div class="social-bar">
          <a href="https://github.com/" target="_blank" title="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://space.bilibili.com/" target="_blank" title="Bilibili">
            <i class="fab fa-bilibili"></i>
          </a>
          <a href="https://blog.wangyuzhe.top" target="_blank" title="博客">
            <i class="fas fa-blog"></i>
          </a>
          <a href="mailto:cloudzhe@example.com" title="邮箱">
            <i class="fas fa-envelope"></i>
          </a>
          <a href="https://blog.wangyuzhe.top/atom.xml" target="_blank" title="RSS">
            <i class="fas fa-rss"></i>
          </a>
        </div>
      </div>

      <!-- ===== Right Zone ===== -->
      <div class="right-zone">
        <!-- Clock + Hitokoto side by side -->
        <div class="top-widgets">
          <div class="glass time-card">
            <div class="tc-date" id="date">加载中...</div>
            <div class="tc-clock" id="clock">00:00:00</div>
            <div class="tc-weather" id="weather">
              <i class="fas fa-spinner fa-spin"></i>
              <span>获取中</span>
            </div>
          </div>

          <div class="glass hito-card">
            <div class="hito-text" id="hitoText">获取一言中...</div>
            <div class="hito-from" id="hitoFrom"></div>
          </div>
        </div>

        <!-- Website Links Grid -->
        <div class="links-section">
          <div class="links-header">
            <i class="fas fa-th-large"></i>
            <span>网站列表</span>
          </div>
          <div class="links-grid">
            <a class="glass link-card" href="https://weibo.com" target="_blank">
              <div class="link-icon" style="background:#e9572b"><i class="fab fa-weibo"></i></div>
              <span>微博</span>
            </a>
            <a class="glass link-card" href="https://www.douyin.com" target="_blank">
              <div class="link-icon" style="background:#323330"><i class="fab fa-tiktok"></i></div>
              <span>抖音</span>
            </a>
            <a class="glass link-card" href="https://tophub.today" target="_blank">
              <div class="link-icon" style="background:#F05032"><i class="fas fa-fire"></i></div>
              <span>今日热榜</span>
            </a>
            <a class="glass link-card" href="https://music.163.com" target="_blank">
              <div class="link-icon" style="background:#007396"><i class="fas fa-music"></i></div>
              <span>音乐</span>
            </a>
            <a class="glass link-card" href="https://www.aliyun.com" target="_blank">
              <div class="link-icon" style="background:#3776AB"><i class="fas fa-cloud"></i></div>
              <span>阿里云</span>
            </a>
            <a class="glass link-card" href="https://blog.wangyuzhe.top" target="_blank">
              <div class="link-icon" style="background:#425AEF"><i class="fas fa-compass"></i></div>
              <span>起始页</span>
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== Footer ===== -->
  <div class="footer">
    <p>&copy; 2026 CloudZhe &middot; <a href="https://blog.wangyuzhe.top">wangyuzhe.top</a></p>
  </div>

  <script>
    // === Background ===
    /**
     * Set background from Bing daily wallpaper with fallback
     */
    function setBg() {
      var el = document.getElementById('bg');
      fetch('https://cn.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var url = 'https://cn.bing.com' + d.images[0].url;
          el.style.backgroundImage = 'url(' + url + ')';
        })
        .catch(function() {
          // Fallback: Unsplash random landscape
          el.style.backgroundImage = 'url(https://source.unsplash.com/1920x1080/?landscape,nature,mountain)';
        });
    }
    setBg();
    setInterval(setBg, 600000);

    // === Clock ===
    /**
     * Update clock and date every second
     */
    function tick() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      var s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m + ':' + s;

      var wd = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('date').textContent =
        now.getFullYear() + '年' +
        String(now.getMonth() + 1).padStart(2, '0') + '月' +
        String(now.getDate()).padStart(2, '0') + '日 ' +
        wd[now.getDay()];
    }
    tick();
    setInterval(tick, 1000);

    // === Weather ===
    /**
     * Fetch weather data with multi-level fallback
     */
    function getWeather() {
      var el = document.getElementById('weather');

      fetch('https://api.vvhan.com/api/weather')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d && d.info) {
            var w = d.info;
            var icon = 'fas fa-cloud';
            if (w.type && w.type.indexOf('晴') >= 0) icon = 'fas fa-sun';
            else if (w.type && (w.type.indexOf('云') >= 0 || w.type.indexOf('阴') >= 0)) icon = 'fas fa-cloud';
            else if (w.type && w.type.indexOf('雨') >= 0) icon = 'fas fa-cloud-rain';
            else if (w.type && w.type.indexOf('雪') >= 0) icon = 'fas fa-snowflake';
            el.innerHTML = '<i class="' + icon + '"></i><span>' +
              w.city + ' ' + w.type + ' ' + w.low + '~' + w.high + '</span>';
          } else {
            showWeatherFallback(el);
          }
        })
        .catch(function() {
          fetch('https://wttr.in/?format=j1')
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (d && d.current_condition) {
                var c = d.current_condition[0];
                var area = d.nearest_area ? d.nearest_area[0].areaName[0].value : '未知';
                var desc = c.weatherDesc ? c.weatherDesc[0].value : '';
                var temp = c.temp_C ? c.temp_C + '°C' : '';
                el.innerHTML = '<i class="fas fa-cloud-sun"></i><span>' +
                  area + ' ' + desc + ' ' + temp + '</span>';
              } else {
                showWeatherFallback(el);
              }
            })
            .catch(function() {
              showWeatherFallback(el);
            });
        });
    }

    /**
     * Weather fallback display
     */
    function showWeatherFallback(el) {
      el.innerHTML = '<i class="fas fa-cloud-sun"></i><span>天气暂不可用</span>';
    }
    getWeather();

    // === Hitokoto ===
    /**
     * Fetch quote from Hitokoto API
     */
    function getHito() {
      var txt = document.getElementById('hitoText');
      var from = document.getElementById('hitoFrom');
      fetch('https://v1.hitokoto.cn/?c=d&c=i&c=k&encode=json')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          txt.textContent = d.hitokoto;
          from.textContent = '— 「' + (d.from || '佚名') + '」';
        })
        .catch(function() {
          txt.textContent = '即使你忘却了我，我也不会遗忘你。';
          from.textContent = '— 「菜月昂」';
        });
    }
    getHito();
    setInterval(getHito, 30000);

    // === Hide loading ===
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading').classList.add('fade');
      }, 400);
    });
  </script>
</body>
</html>
